# =============================================================================
# Nginx reverse proxy - UMS Mart API
#
# Install:
#   sudo cp deployment/nginx/ums_mart.conf /etc/nginx/sites-available/ums_mart
#   sudo ln -s /etc/nginx/sites-available/ums_mart /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace every occurrence of `api.umsmart.com` with your real domain.
#
# Nginx terminates TLS, serves /static/ and /media/ straight from disk and
# proxies everything else to the Gunicorn UNIX socket. Django never has to
# serve a file, and Gunicorn is unreachable from the public internet.
# =============================================================================

# ---------------------------------------------------------------------------
# Upstream: the Gunicorn socket created by deployment/scripts/ums-mart.service
# ---------------------------------------------------------------------------
upstream ums_mart_api {
    server unix:/run/gunicorn/ums_mart.sock fail_timeout=0;
}

# ---------------------------------------------------------------------------
# Rate limiting: two zones so a single abusive client cannot exhaust workers.
# ---------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=ums_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=ums_auth:10m rate=5r/m;

# ---------------------------------------------------------------------------
# HTTP -> HTTPS (also answers the Let's Encrypt HTTP-01 challenge)
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.umsmart.com;

    # certbot needs this path over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.umsmart.com;

    # --- TLS ---------------------------------------------------------------
    # certbot --nginx fills these in. To use a certificate you bought
    # elsewhere, point them at your own fullchain.pem / privkey.pem.
    ssl_certificate     /etc/letsencrypt/live/api.umsmart.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.umsmart.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # HSTS is also set by Django; keep them consistent. Start with a small
    # max-age and only raise it (and add preload) once HTTPS is stable.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Security headers ---------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # Only add a CSP once you know which front-end origins you will allow.
    # add_header Content-Security-Policy "default-src 'self'" always;

    # --- Request limits -----------------------------------------------------
    # Payment screenshots and product images: keep in step with
    # MAX_UPLOAD_SIZE_MB in .env (Django rejects oversized files too).
    client_max_body_size 10M;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # --- Logging ------------------------------------------------------------
    access_log /var/log/nginx/ums_mart_access.log;
    error_log  /var/log/nginx/ums_mart_error.log warn;

    # --- Compression --------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/xhtml+xml image/svg+xml;

    # -----------------------------------------------------------------------
    # Static files - collected by `manage.py collectstatic`
    # -----------------------------------------------------------------------
    location /static/ {
        alias /home/ums_mart/backend/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # -----------------------------------------------------------------------
    # Media files - user uploads (product images, payment proofs, banners)
    #
    # SECURITY: payment screenshots end up here. This block serves them to
    # anyone who guesses a filename. Before going live, either (a) restrict
    # this location to staff IPs, or (b) move media to object storage with
    # signed URLs. See deployment/README.md > Hardening.
    # -----------------------------------------------------------------------
    location /media/ {
        alias /home/ums_mart/backend/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;

        # Block script execution in the upload directory.
        location ~* \.(php|py|pl|sh|cgi)$ {
            deny all;
        }
    }

    # -----------------------------------------------------------------------
    # Health check - no rate limit, no logging noise
    # -----------------------------------------------------------------------
    location = /health/ {
        proxy_pass http://ums_mart_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # -----------------------------------------------------------------------
    # API + docs
    # -----------------------------------------------------------------------
    location / {
        # Burst-tolerant: real users occasionally fire a page of parallel
        # requests; bots hammering the API get a 503.
        limit_req zone=ums_api burst=40 nodelay;

        proxy_pass http://ums_mart_api;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_redirect off;

        # Streaming uploads should not be buffered to disk twice.
        proxy_request_buffering off;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
